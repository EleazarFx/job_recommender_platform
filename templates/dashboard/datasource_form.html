{% extends 'base/base.html' %}

{% block title %}Data Source - {{ block.super }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1>{% if form.instance.pk %}Edit{% else %}Add{% endif %} Data Source</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{% url 'dashboard:ingestion' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
