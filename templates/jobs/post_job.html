{% extends 'base/base.html' %}

{% block title %}Post a Job - {{ block.super }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-lg-8 mx-auto">
            <div class="card">
                <div class="card-header">
                    <h3>Post a New Job</h3>
                </div>
                <div class="card-body">
                    <div class="alert alert-info">
                        <i class="fas fa-info-circle"></i>
                        Job posting feature is coming soon!
                    </div>
                    <p>In the meantime, please contact us to post a job.</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
